{% extends "base.html" %}

{% block title %}{{ titulo }} - SGC{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 500px;">
    <h1 class="h3 mb-4">{{ titulo }}</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- se tem cliente_id é edição, senão é cadastro -->
            <form method="POST"
                  action="{{ url_for('cliente_editar', id=cliente_id) if cliente_id else url_for('cliente_novo') }}">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome"
                           value="{{ form.nome or '' }}" maxlength="100" autofocus>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="text" class="form-control" id="email" name="email"
                           value="{{ form.email or '' }}" maxlength="100">
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone <span class="text-muted">(opcional)</span></label>
                    <input type="text" class="form-control" id="telefone" name="telefone"
                           value="{{ form.telefone or '' }}" placeholder="Ex: 51999998888">
                </div>

                <div class="mb-3">
                    <label for="cpf_cnpj" class="form-label">CPF ou CNPJ</label>
                    <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj"
                           value="{{ form.cpf_cnpj or '' }}" placeholder="Somente números">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('clientes') }}" class="btn btn-outline-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
